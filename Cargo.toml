[workspace]
resolver = "2"
members = [
    "app/src-tauri",
    "crates/termix-core",
    "crates/termix-logging",
    "crates/termix-security",
    "crates/termix-storage",
    "crates/termix-network",
    "crates/termix-ssh",
    "crates/termix-sftp",
    "crates/termix-terminal",
    "crates/termix-monitor",
    "crates/termix-protocols",
    "crates/termix-sync",
    "crates/termix-automation",
    "crates/termix-session",
    "crates/termix-ffi",
    "crates/termix-cli",
]
default-members = [
    "crates/termix-core",
    "crates/termix-logging",
    "crates/termix-security",
    "crates/termix-storage",
    "crates/termix-network",
    "crates/termix-ssh",
    "crates/termix-sftp",
    "crates/termix-terminal",
    "crates/termix-monitor",
    "crates/termix-protocols",
    "crates/termix-sync",
    "crates/termix-automation",
    "crates/termix-session",
    "crates/termix-ffi",
    "crates/termix-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Nishanth <https://github.com/nishanth-kj>"]
repository = "https://github.com/nishanth-kj/Termix"
rust-version = "1.95"
description = "Termix — every machine, one control center"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
russh = "0.63"
russh-sftp = "3"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.40"
directories = "5"
libc = "0.2"
vte = "0.13"
