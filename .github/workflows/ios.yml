name: iOS
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the UI
        run: npm ci && npm run build
        working-directory: app
      # An installable .ipa needs an Apple developer account, so this only proves the
      # Rust code compiles for iOS. Add signing secrets to go further.
      - run: cargo build -p termix-app --lib --target aarch64-apple-ios
      - run: cargo build -p termix-app --lib --target aarch64-apple-ios-sim
