name: Desktop bundle
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: NASM for aws-lc
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: cargo install tauri-cli --version "^2" --locked
      - run: npm ci
        working-directory: app
      # Unsigned. Signing needs certificates this repository does not have.
      - run: cargo tauri build
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: termix-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
