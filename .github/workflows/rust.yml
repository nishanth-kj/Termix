name: Rust
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --exclude termix-app
      - name: Clippy
        run: cargo clippy --workspace --exclude termix-app --all-targets -- -D warnings
